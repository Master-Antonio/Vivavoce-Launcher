name: Build and Release Multiplatform Launcher

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: vivavoce-launcher-windows-x86_64.exe
            use_cross: false

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: vivavoce-launcher-macos-arm64
            use_cross: false

          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: vivavoce-launcher-macos-x86_64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Prepare Windows Artifact
      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/vivavoce-launcher.exe ${{ matrix.artifact_name }}

      # Prepare macOS Binary and .app bundle
      - name: Package macOS App Bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/vivavoce-launcher"
          cp "$BIN_PATH" "${{ matrix.artifact_name }}"
          chmod +x "${{ matrix.artifact_name }}"

          # Create .app structure
          APP_NAME="VivaVoce Launcher.app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp "$BIN_PATH" "$APP_NAME/Contents/MacOS/vivavoce-launcher"
          chmod +x "$APP_NAME/Contents/MacOS/vivavoce-launcher"
          cp extra/macos/Info.plist "$APP_NAME/Contents/Info.plist"

          # Create zip archive of the .app
          ZIP_NAME="vivavoce-launcher-${{ matrix.target }}.app.zip"
          zip -r "$ZIP_NAME" "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: |
            ${{ matrix.artifact_name }}
            *.app.zip

  create-universal-macos:
    name: Create macOS Universal Binary
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: aarch64-apple-darwin-artifact

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: x86_64-apple-darwin-artifact

      - name: Merge universal binary with lipo
        shell: bash
        run: |
          lipo -create -output vivavoce-launcher-macos-universal \
            vivavoce-launcher-macos-arm64 \
            vivavoce-launcher-macos-x86_64
          chmod +x vivavoce-launcher-macos-universal

          # Create Universal .app bundle
          APP_NAME="VivaVoce Launcher (Mac Universal).app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp vivavoce-launcher-macos-universal "$APP_NAME/Contents/MacOS/vivavoce-launcher"
          chmod +x "$APP_NAME/Contents/MacOS/vivavoce-launcher"
          cp extra/macos/Info.plist "$APP_NAME/Contents/Info.plist"

          zip -r "VivaVoce-Launcher-macOS-Universal.zip" "$APP_NAME"

      - name: Upload Universal macOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-bundle
          path: |
            vivavoce-launcher-macos-universal
            VivaVoce-Launcher-macOS-Universal.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, create-universal-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */*
          generate_release_notes: true
