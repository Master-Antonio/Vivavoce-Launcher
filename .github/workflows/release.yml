name: Build and Release Multiplatform Launcher

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (windows-latest - x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows Binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/vivavoce-launcher.exe dist/vivavoce-launcher-windows-x86_64.exe
          cp target/release/vivavoce-launcher.exe dist/vivavoce-launcher.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/*

  build-macos:
    name: Build (macos-latest - Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --target aarch64-apple-darwin

      - name: Build release ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build release x86_64 (Intel)
        continue-on-error: true
        id: build_intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Assemble Universal and App Bundle
        shell: bash
        run: |
          mkdir -p dist

          ARM64_BIN="target/aarch64-apple-darwin/release/vivavoce-launcher"
          INTEL_BIN="target/x86_64-apple-darwin/release/vivavoce-launcher"

          cp "$ARM64_BIN" dist/vivavoce-launcher-macos-arm64
          chmod +x dist/vivavoce-launcher-macos-arm64

          if [ -f "$INTEL_BIN" ]; then
            echo "Merging universal binary with lipo..."
            cp "$INTEL_BIN" dist/vivavoce-launcher-macos-x86_64
            chmod +x dist/vivavoce-launcher-macos-x86_64
            lipo -create -output dist/vivavoce-launcher-macos-universal "$ARM64_BIN" "$INTEL_BIN"
          else
            echo "Intel build not available, copying arm64 as universal..."
            cp "$ARM64_BIN" dist/vivavoce-launcher-macos-universal
          fi
          chmod +x dist/vivavoce-launcher-macos-universal

          # Create macOS .app bundle
          APP_NAME="VivaVoce Launcher.app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"
          cp dist/vivavoce-launcher-macos-universal "$APP_NAME/Contents/MacOS/vivavoce-launcher"
          chmod +x "$APP_NAME/Contents/MacOS/vivavoce-launcher"
          cp extra/macos/Info.plist "$APP_NAME/Contents/Info.plist"

          zip -r "dist/VivaVoce-Launcher-macOS-Universal.zip" "$APP_NAME"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: dist/*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
